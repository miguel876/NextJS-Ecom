name: NextJS CI

on:
  pull_request:
    branches: ['main', 'dev']

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository manually
      - name: Checkout repository
        run: |
          git clone ${{ github.repository_url }} repo
          cd repo
          git fetch --depth=1 origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}

      # Set up Node.js manually
      - name: Set up Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node -v
          npm -v

      # Install dependencies, lint, test, and build
      - name: Install dependencies and run checks
        run: |
          cd repo
          npm ci
          npm run lint
          npm test
          npm run build
