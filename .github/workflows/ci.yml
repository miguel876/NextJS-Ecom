name: NextJS CI

on:
  pull_request:
    branches: ['main', 'dev']

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm ci
          npm run lint
          npm test
          npm run build
